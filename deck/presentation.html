<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Inference Is a Black Box — GPU-Aware Observability</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141922; --panel-2:#1c2230; --ink:#e6edf3;
    --muted:#8b95a5; --line:#2a3241;
    --accent:#f2b807;  /* Grafana yellow */
    --ok:#3ecf8e;      /* vLLM/tokens green */
    --warn:#ff6b6b;    /* constrained */
    --info:#4c9aff;    /* traces blue */
    --cool:#a78bfa;    /* over-prov purple */
    --mono:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
    --sans:-apple-system,'Inter','Segoe UI',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);height:100%;overflow:hidden}
  a{color:var(--info)}

  /* Sidebar */
  #sidebar{
    position:fixed;top:0;left:0;bottom:0;width:260px;background:var(--panel);
    border-right:1px solid var(--line);padding:24px 0;overflow:auto;z-index:10;
  }
  #sidebar h1{
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    margin:0 24px 18px;font-weight:600;
  }
  #sidebar ol{list-style:none;padding:0;margin:0;counter-reset:ch}
  #sidebar li{counter-increment:ch}
  #sidebar li a{
    display:block;padding:9px 24px 9px 52px;color:var(--muted);text-decoration:none;
    font-size:13.5px;position:relative;border-left:3px solid transparent;
  }
  #sidebar li a::before{
    content:counter(ch,decimal-leading-zero);position:absolute;left:20px;top:9px;
    color:var(--line);font-family:var(--mono);font-size:11px;
  }
  #sidebar li a:hover{color:var(--ink);background:rgba(255,255,255,.02)}
  #sidebar li a.active{color:var(--accent);border-left-color:var(--accent);background:rgba(242,184,7,.06)}
  #sidebar li a.active::before{color:var(--accent)}

  /* Main stage */
  #stage{margin-left:260px;height:100vh;position:relative;overflow:hidden}
  .slide{
    position:absolute;inset:0;padding:64px 88px;display:none;flex-direction:column;
    animation:fade .35s ease-out;
  }
  .slide.active{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
  h2{font-size:44px;line-height:1.1;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
  h3{font-size:22px;color:var(--muted);font-weight:500;margin:0 0 40px}
  h4{font-size:18px;margin:0 0 10px;color:var(--ink);font-weight:600}
  p{font-size:20px;line-height:1.55;color:#c8d0dc;margin:0 0 14px;max-width:52em}
  ul.plain{list-style:none;padding:0;margin:0}
  ul.plain li{font-size:19px;line-height:1.5;padding:8px 0 8px 26px;position:relative;color:#c8d0dc}
  ul.plain li::before{content:'';position:absolute;left:0;top:19px;width:14px;height:2px;background:var(--accent);border-radius:2px}

  /* Counter */
  #counter{position:fixed;top:20px;right:26px;font-family:var(--mono);font-size:12px;color:var(--muted);z-index:11}
  #counter b{color:var(--accent);font-weight:600}
  #hint{position:fixed;bottom:20px;right:26px;font-family:var(--mono);font-size:11px;color:var(--line);z-index:11}

  /* Utility */
  .row{display:flex;gap:28px}
  .col{flex:1;min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
  .card.tight{padding:16px 18px}
  .kbd{font-family:var(--mono);font-size:14px;color:var(--muted);background:var(--panel-2);padding:2px 8px;border-radius:5px;border:1px solid var(--line)}
  pre{background:#07090d;border:1px solid var(--line);border-radius:10px;padding:18px 20px;font-family:var(--mono);font-size:13.5px;line-height:1.55;overflow:auto;color:#d6dde8}
  pre .k{color:#f2b807} pre .s{color:#3ecf8e} pre .c{color:#5c6a7d;font-style:italic} pre .n{color:#4c9aff} pre .v{color:#ff6b6b}
  .tag{display:inline-block;font-family:var(--mono);font-size:12px;padding:3px 10px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);margin-right:6px}
  .tag.ok{color:var(--ok);border-color:rgba(62,207,142,.35)}
  .tag.warn{color:var(--warn);border-color:rgba(255,107,107,.35)}
  .tag.info{color:var(--info);border-color:rgba(76,154,255,.35)}

  /* Hero stat */
  .hero{display:flex;flex-direction:column;justify-content:center;height:100%;align-items:flex-start}
  .stat{font-size:180px;line-height:1;font-weight:800;letter-spacing:-.04em}
  .stat small{font-size:44px;color:var(--muted);font-weight:500;margin-left:14px;letter-spacing:0}
  .stat.ok{color:var(--ok)} .stat.warn{color:var(--warn)} .stat.acc{color:var(--accent)}

  /* Comparison two column bars */
  .bar{height:64px;background:var(--panel-2);border-radius:8px;position:relative;overflow:hidden;margin:8px 0 20px}
  .bar > span{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;padding-left:16px;color:#0b0e14;font-weight:700;font-family:var(--mono);font-size:20px}
  .bar.warn > span{background:var(--warn)}
  .bar.cool > span{background:var(--cool)}

  /* Architecture diagram grid */
  .arch{display:grid;grid-template-columns:1fr 80px 1fr 80px 1fr;grid-template-rows:auto auto auto;gap:16px;align-items:center;margin-top:12px}
  .arch .node{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center}
  .arch .node .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
  .arch .node .name{font-size:18px;font-weight:600}
  .arch .node .meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:6px}
  .arch .node.dcgm{border-color:rgba(242,184,7,.35)}
  .arch .node.logs{border-color:rgba(62,207,142,.35)}
  .arch .node.trace{border-color:rgba(76,154,255,.35)}
  .arch .arrow{color:var(--line);text-align:center;font-family:var(--mono);font-size:22px}
  .arch .join{grid-column:1 / -1;background:linear-gradient(180deg,rgba(242,184,7,.08),rgba(242,184,7,.02));border:1px dashed var(--accent);border-radius:12px;padding:18px;text-align:center;margin-top:8px}
  .arch .join b{color:var(--accent);font-family:var(--mono)}

  /* footer per slide */
  .foot{position:absolute;left:88px;right:88px;bottom:28px;display:flex;justify-content:space-between;color:var(--muted);font-family:var(--mono);font-size:12px;border-top:1px solid var(--line);padding-top:10px}

  /* metric readout */
  .readout{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
  .readout .r{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:180px}
  .readout .r .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .readout .r .v{font-family:var(--mono);font-size:22px;color:var(--accent);margin-top:4px}
</style>
</head>

<template id="slide-problem">
  <section class="slide">
    <div class="eyebrow">The problem</div>
    <h2>Three signals. Zero connection.</h2>
    <div class="row" style="margin-top:32px">
      <div class="col card">
        <span class="tag">Signal A</span>
        <h4 style="margin-top:14px">GPU hardware metrics</h4>
        <p style="font-size:16px">DCGM tells you a GPU is hot. It won't tell you whose pod is frying it.</p>
      </div>
      <div class="col card">
        <span class="tag ok">Signal B</span>
        <h4 style="margin-top:14px">Serving logs</h4>
        <p style="font-size:16px">vLLM prints throughput and KV-cache pressure to stdout — as free text no one queries.</p>
      </div>
      <div class="col card">
        <span class="tag info">Signal C</span>
        <h4 style="margin-top:14px">Distributed traces</h4>
        <p style="font-size:16px">One slow request. Which pod? Which GPU? Which memory-pressure event? Nobody knows.</p>
      </div>
    </div>
    <p style="margin-top:36px;font-size:22px;color:var(--ink)">
      Teams discover GPU memory pressure <b style="color:var(--warn)">from a page</b>, not a dashboard,
      because nothing ties these three signals together at the pod level.
    </p>
  </section>
</template>

<template id="slide-util-lies">
  <section class="slide">
    <div class="eyebrow">Prerequisite</div>
    <h2>GPU utilization % lies.</h2>
    <div class="row" style="margin-top:24px">
      <div class="col">
        <p><code class="kbd">nvidia-smi</code> "100%" can mean:</p>
        <ul class="plain">
          <li>All Streaming Multiprocessors doing heavy work</li>
          <li>One tiny kernel active for one instant per sample window</li>
        </ul>
        <p style="margin-top:24px">You need <b style="color:var(--accent)">deeper signals</b>: SM active ratio, framebuffer, DRAM active, power draw vs TDP.</p>
      </div>
      <div class="col card">
        <h4>What we actually collect</h4>
        <ul class="plain" style="font-family:var(--mono);font-size:14px">
          <li>DCGM_FI_DEV_FB_USED    <span style="color:var(--muted)"># memory pressure</span></li>
          <li>DCGM_FI_PROF_SM_ACTIVE <span style="color:var(--muted)"># real compute</span></li>
          <li>DCGM_FI_PROF_DRAM_ACTIVE</li>
          <li>DCGM_FI_DEV_POWER_USAGE <span style="color:var(--muted)"># vs TDP</span></li>
        </ul>
      </div>
    </div>
  </section>
</template>

<template id="slide-dcgm">
  <section class="slide">
    <div class="eyebrow">Signal A · dcgm-exporter</div>
    <h2>Pod mapping from the kubelet.</h2>
    <div class="row">
      <div class="col">
        <p>The exporter runs as a DaemonSet on GPU nodes and reads the kubelet <b>pod-resources</b> socket. That's how it attaches <code class="kbd">pod</code>, <code class="kbd">namespace</code>, <code class="kbd">container</code> to every metric.</p>
        <ul class="plain">
          <li>Flag: <code class="kbd">--kubernetes=true</code></li>
          <li>Mount: <code class="kbd">/var/lib/kubelet/pod-resources</code></li>
          <li>On EKS Auto Mode: don't install the NVIDIA GPU Operator — Auto Mode already manages drivers + device plugin. Run dcgm-exporter <b>standalone</b>.</li>
        </ul>
      </div>
      <div class="col card">
        <h4>The DaemonSet, distilled</h4>
<pre><span class="k">args</span>:
  - <span class="s">"-f"</span>
  - <span class="s">"/etc/dcgm-exporter/counters.csv"</span>
  - <span class="s">"--kubernetes=true"</span>
  - <span class="s">"--kubernetes-gpu-id-type=uid"</span>
<span class="k">env</span>:
  - name: <span class="n">DCGM_EXPORTER_KUBERNETES_ENABLE_POD_LABELS</span>
    value: <span class="s">"false"</span>   <span class="c"># see next slide</span></pre>
      </div>
    </div>
  </section>
</template>

<template id="slide-cardinality">
  <section class="slide">
    <div class="eyebrow">War story 1</div>
    <h2>The cardinality explosion.</h2>
    <div class="row">
      <div class="col">
        <p>Turn on <code class="kbd">ENABLE_POD_LABELS=true</code> and every arbitrary pod label becomes a metric label. Every GPU series multiplies by pod-label × pod-generation churn.</p>
        <p style="color:var(--warn)">Prometheus tips over. TSDB grows. Queries slow. You caused it in one commit.</p>
      </div>
      <div class="col">
        <h4>What is bounded vs unbounded</h4>
        <ul class="plain">
          <li><b style="color:var(--ok)">Bounded</b>: pod name, namespace, container (from <code class="kbd">--kubernetes=true</code>) — safe.</li>
          <li><b style="color:var(--warn)">Unbounded</b>: arbitrary pod labels (app-version, git-sha, replicaset hash) — the trap.</li>
        </ul>
        <h4 style="margin-top:20px">Fix</h4>
<pre><span class="c"># either flip off:</span>
DCGM_EXPORTER_KUBERNETES_ENABLE_POD_LABELS=<span class="s">"false"</span>

<span class="c"># or allow-list:</span>
DCGM_EXPORTER_KUBERNETES_POD_LABEL_ALLOWLIST_REGEX=<span class="s">"app|model"</span></pre>
      </div>
    </div>
  </section>
</template>

<template id="slide-fluentbit">
  <section class="slide">
    <div class="eyebrow">Signal B · Fluent Bit + Lua</div>
    <h2>Parse tokens/s out of stdout.</h2>
    <div class="row">
      <div class="col">
        <p>vLLM prints engine stats every ~10s to its container log. Fluent Bit tails, the <b>kubernetes filter</b> attaches pod metadata, and a <b>Lua filter</b> regex-extracts the numbers.</p>
        <h4 style="margin-top:16px">The raw log line</h4>
<pre style="font-size:12px">INFO 07:12:56 [metrics.py:486] Avg prompt throughput: 254.6 tokens/s,
Avg generation throughput: 462.7 tokens/s, Running: 0 reqs, Waiting: 0 reqs,
GPU KV cache usage: 0.0%, CPU KV cache usage: 0.0%.</pre>
      </div>
      <div class="col card">
        <h4>extract_tokens.lua</h4>
<pre><span class="k">function</span> extract_vllm_metrics(tag, ts, record)
  <span class="k">local</span> line = record[<span class="s">"log"</span>] <span class="k">or</span> <span class="s">""</span>
  <span class="k">local</span> gen = <span class="n">string.match</span>(line,
    <span class="s">"generation throughput:%s*([%d%.]+)%s*tokens/s"</span>)
  <span class="k">if</span> gen == <span class="k">nil</span> <span class="k">then</span>
    record[<span class="s">"vllm_parsed"</span>] = <span class="s">"false"</span>
    <span class="k">return</span> 1, ts, record
  <span class="k">end</span>
  record[<span class="s">"gen_tokens_per_s"</span>]   = <span class="n">tonumber</span>(gen)
  record[<span class="s">"kv_cache_usage_pct"</span>] = <span class="n">tonumber</span>(
    <span class="n">string.match</span>(line, <span class="s">"KV cache usage:%s*([%d%.]+)%%"</span>))
  <span class="c">-- promote pod identity to the top level</span>
  <span class="k">local</span> k = record[<span class="s">"kubernetes"</span>] <span class="k">or</span> {}
  record[<span class="s">"pod_name"</span>]  = k[<span class="s">"pod_name"</span>]
  record[<span class="s">"namespace"</span>] = k[<span class="s">"namespace_name"</span>]
  <span class="k">return</span> 2, ts, record
<span class="k">end</span></pre>
      </div>
    </div>
  </section>
</template>

<template id="slide-otel">
  <section class="slide">
    <div class="eyebrow">Signal C · OTel Collector</div>
    <h2>Stamp pod identity onto every span.</h2>
    <div class="row">
      <div class="col">
        <p>vLLM ships OTLP traces natively — <code class="kbd">--otlp-traces-endpoint</code>. But the raw spans only know <i>which service sent them</i>, not <i>which pod on which node</i>.</p>
        <p>The <code class="kbd">k8sattributes</code> processor is the correlation step: it looks up each span's source IP against the pod cache and stamps <b>k8s.pod.name</b>, <b>namespace</b>, <b>node</b>, <b>deployment</b>.</p>
        <p style="color:var(--muted);margin-top:22px">Now a slow trace can be dropped onto the same DCGM framebuffer chart, by pod, in one glance.</p>
      </div>
      <div class="col card">
        <h4>otel-collector.yaml</h4>
<pre><span class="k">processors</span>:
  <span class="n">k8sattributes</span>:
    auth_type: serviceAccount
    extract:
      metadata:
        - <span class="s">k8s.namespace.name</span>
        - <span class="s">k8s.pod.name</span>
        - <span class="s">k8s.pod.uid</span>
        - <span class="s">k8s.node.name</span>
        - <span class="s">k8s.deployment.name</span>
    <span class="n">pod_association</span>:
      - sources: [ { from: <span class="s">connection</span> } ]

<span class="k">service</span>:
  pipelines:
    <span class="n">traces</span>:
      receivers:  [otlp]
      processors: [<span class="v">k8sattributes</span>, batch]
      exporters:  [otlp/jaeger]</pre>
      </div>
    </div>
  </section>
</template>

<template id="slide-moneyshot">
  <section class="slide">
    <div class="eyebrow">Live demo · Grafana</div>
    <h2>Two pods. Same load. Different memory story.</h2>
    <div class="row" style="align-items:stretch">
      <div class="col card">

<template id="slide-gotchas">
  <section class="slide">
    <div class="eyebrow">What actually broke when we built this</div>
    <h2>Three gotchas the docs won't warn you about.</h2>
    <div class="row" style="margin-top:24px">
      <div class="col card">
        <span class="tag warn">gotcha</span>
        <h4 style="margin-top:12px">EKS Auto Mode + GPU Operator = conflict</h4>
        <p style="font-size:16px">Auto Mode already ships NVIDIA drivers + device plugin in the accelerated AMI. Installing the GPU Operator on top fights it. Run <b>dcgm-exporter standalone</b> instead.</p>
      </div>
      <div class="col card">
        <span class="tag warn">gotcha</span>
        <h4 style="margin-top:12px">Fluent Bit tag prefix</h4>
        <p style="font-size:16px">Custom <code class="kbd">Tag</code> patterns break the kubernetes filter silently — it logs <i>"invalid pattern for given tag"</i> and skips metadata. Fix: <code class="kbd">Tag kube.*</code> + <code class="kbd">Kube_Tag_Prefix kube.var.log.containers.</code></p>
      </div>
      <div class="col card">
        <span class="tag warn">gotcha</span>
        <h4 style="margin-top:12px">Terraform helm provider · dead repos</h4>
        <p style="font-size:16px">The helm provider walks every configured repo. One stale entry (e.g. <code class="kbd">stable</code>) with no cached index and every apply dies: <i>"no cached repo found stable-index.yaml"</i>. <code class="kbd">helm repo remove stable</code> and move on.</p>
      </div>
    </div>
  </section>
</template>

<template id="slide-takeaways">

    <div class="eyebrow">Takeaways</div>
    <h2>What to steal for your cluster.</h2>
    <ul class="plain" style="margin-top:12px">
      <li><b>Pick one join key</b> — pod identity — and enforce it on all three pipelines. Everything else follows.</li>
      <li><b>Use dcgm-exporter in Kubernetes mode</b>. Skip the arbitrary pod-label enrichment. Bounded labels only.</li>
      <li><b>Parse serving logs in Fluent Bit</b> with Lua — token throughput and KV-cache % that Prometheus can't see are one regex away.</li>
      <li><b>Add k8sattributes to your OTel Collector</b>. It's the one processor that makes traces queryable against GPU metrics.</li>
      <li><b>Own the failure modes</b>: cardinality, tag prefixes, dead helm repos, driver stack conflicts. Document them so the next person doesn't rediscover them at 2am.</li>
    </ul>
  </section>
</template>

<script>
(function(){
  const slides = JSON.parse(document.getElementById('slides').textContent);
  const toc = document.getElementById('toc');
  const stage = document.getElementById('stage');
  slides.forEach((s,i)=>{
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#'; a.textContent = s.ch; a.dataset.idx = i;
    a.onclick = e => { e.preventDefault(); go(i); };
    li.appendChild(a); toc.appendChild(li);
    const tpl = document.getElementById('slide-'+s.id);
    if(tpl){
      const node = tpl.content.firstElementChild.cloneNode(true);
      node.dataset.idx = i;
      stage.appendChild(node);
    }
  });
  document.getElementById('tot').textContent = slides.length;
  let cur = 0;
  function go(i){
    cur = Math.max(0, Math.min(slides.length-1, i));
    document.querySelectorAll('#stage .slide').forEach((el,j)=>el.classList.toggle('active', j===cur));
    document.querySelectorAll('#sidebar a').forEach((el,j)=>el.classList.toggle('active', j===cur));
    document.getElementById('cur').textContent = cur+1;
    location.hash = slides[cur].id;
  }
  document.addEventListener('keydown', e => {
    if(e.key==='ArrowRight' || e.key===' '||e.key==='PageDown') go(cur+1);
    else if(e.key==='ArrowLeft' || e.key==='PageUp') go(cur-1);
    else if(e.key==='Home') go(0);
    else if(e.key==='End') go(slides.length-1);
  });
  const initial = slides.findIndex(s=>s.id===location.hash.slice(1));
  go(initial>=0 ? initial : 0);
})();
</script>
