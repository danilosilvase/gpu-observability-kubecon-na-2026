apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: observability
  labels: { app: dcgm-exporter }
spec:
  selector:
    matchLabels: { app: dcgm-exporter }
  template:
    metadata:
      labels: { app: dcgm-exporter }
    spec:
      # land only on GPU nodes and tolerate the taint from the NodePool
      nodeSelector: { workload-type: gpu-inference }
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
          args:
            - "-f"
            - "/etc/dcgm-exporter/counters.csv"
            # KUBERNETES MODE: attach pod/namespace/container labels by reading
            # the kubelet pod-resources socket. This is what makes the pod-join possible.
            - "--kubernetes=true"
            - "--kubernetes-gpu-id-type=uid"
          env:
            # CARDINALITY CONTROL (the "what broke" slide):
            # do NOT enable arbitrary pod-label enrichment. Only the fixed
            # pod/namespace/container labels from kubernetes mode are added.
            - name: DCGM_EXPORTER_KUBERNETES_ENABLE_POD_LABELS
              value: "false"
            - name: DCGM_EXPORTER_LISTEN
              value: ":9400"
          ports:
            - name: metrics
              containerPort: 9400
          securityContext:
            capabilities: { add: ["SYS_ADMIN"] }
          volumeMounts:
            - { name: counters, mountPath: /etc/dcgm-exporter }
            - { name: pod-resources, mountPath: /var/lib/kubelet/pod-resources, readOnly: true }
      volumes:
        - name: counters
          configMap: { name: dcgm-exporter-counters }
        - name: pod-resources
          hostPath: { path: /var/lib/kubelet/pod-resources }
---
apiVersion: v1
kind: Service
metadata:
  name: dcgm-exporter
  namespace: observability
  labels: { app: dcgm-exporter }
spec:
  selector: { app: dcgm-exporter }
  ports:
    - { name: metrics, port: 9400, targetPort: 9400 }
