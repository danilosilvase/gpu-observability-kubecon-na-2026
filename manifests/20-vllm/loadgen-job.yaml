# Simple load generator to make TTFT / tokens/sec / KV-cache pressure move
# during the live demo. Points at the vLLM service.
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-loadgen
  namespace: inference
spec:
  parallelism: 4
  completions: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: hey
          image: python:3.12-slim
          command: ["/bin/sh","-c"]
          args:
            - |
              pip install --quiet openai==1.* && python - <<'PY'
              import os, time, concurrent.futures as cf
              from openai import OpenAI
              c = OpenAI(base_url="http://vllm-opt125m.inference:8000/v1", api_key="x")
              def one(i):
                  c.completions.create(model="facebook/opt-125m",
                      prompt="Explain GPU observability in one paragraph. "*8,
                      max_tokens=256)
              for _ in range(50):
                  with cf.ThreadPoolExecutor(max_workers=16) as e:
                      list(e.map(one, range(16)))
                  time.sleep(1)
              PY
