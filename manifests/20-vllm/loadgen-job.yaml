# Load generator: keeps TTFT / tokens-s / KV-cache pressure moving for the
# whole demo. Runs for DEMO_SECONDS wall-clock (default 720s = 12 min), not a
# fixed request count, so the charts stay live from setup through Q&A.
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-loadgen
  namespace: inference
spec:
  parallelism: 4
  completions: 4
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: hey
          image: python:3.12-slim
          env:
            - { name: DEMO_SECONDS, value: "720" }
          command: ["/bin/sh","-c"]
          args:
            - |
              pip install --quiet openai==1.* && python - <<'PY'
              import os, time, concurrent.futures as cf
              from openai import OpenAI
              # Drive BOTH deployments so constrained vs over-provisioned both light up.
              targets = [
                  OpenAI(base_url="http://vllm-constrained.inference:8000/v1", api_key="x"),
                  OpenAI(base_url="http://vllm-overprov.inference:8000/v1",   api_key="x"),
              ]
              def one(i):
                  targets[i % len(targets)].completions.create(
                      model="facebook/opt-125m",
                      prompt="Explain GPU observability in one paragraph. "*8,
                      max_tokens=256)
              deadline = time.time() + int(os.environ.get("DEMO_SECONDS", "720"))
              while time.time() < deadline:
                  with cf.ThreadPoolExecutor(max_workers=16) as e:
                      list(e.map(one, range(16)))
                  time.sleep(1)
              PY
