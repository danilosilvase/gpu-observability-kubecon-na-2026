# Demo load + hop 1 of the trace. SAME traffic to both pods, so only --gpu-memory-utilization differs:
#   192 long requests at a time to each pod, unique prefix (defeats prefix caching), ignore_eos.
#   vllm-constrained (0.08): KV cache hits 100%, ~140 requests wait, time to first token ~6 s.
#   vllm-overprov    (0.90): KV cache peaks ~30%, nothing waits, time to first token ~0.1 s.
#   DCGM GPU memory stays flat on both. Measured on NVIDIA A10G (g5.xlarge).
# Every request is a client span ("chat request") whose traceparent header vLLM continues,
# so each trace has two hops: client pod -> vLLM pod, both stamped with k8s.pod.name by the Collector.
# On start it drops a "load hits" annotation on the Grafana dashboard.
#
#   Start it with demo/load.sh (restarts the Job and passes the Grafana password).
apiVersion: batch/v1
kind: Job
metadata: { name: vllm-loadgen, namespace: inference }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1500
  template:
    metadata: { labels: { app: vllm-loadgen } }
    spec:
      restartPolicy: Never
      containers:
        - name: loadgen
          image: python:3.12-slim
          env:
            - { name: DEMO_SECONDS,  value: "1200" }
            - { name: STEADY_CONC,   value: "192" }
            - { name: SATURATE_CONC, value: "192" }
            - { name: STEADY_URL,    value: "http://vllm-overprov.inference:8000/v1/completions" }
            - { name: SATURATE_URL,  value: "http://vllm-constrained.inference:8000/v1/completions" }
            - { name: OTEL_SERVICE_NAME,           value: "chat-client" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability:4318" }
            - { name: GRAFANA_URL,  value: "http://kube-prometheus-stack-grafana.observability" }
            - { name: GRAFANA_AUTH, value: "admin:gpu-obs-demo" }   # demo/load.sh replaces this with GRAFANA_PASSWORD
          command: ["sh", "-c"]
          args:
            - |
              pip install -q --no-cache-dir --disable-pip-version-check --root-user-action=ignore \
                opentelemetry-sdk==1.40.0 opentelemetry-exporter-otlp-proto-http==1.40.0 && python -u - <<'PY'
              import os, time, json, threading, uuid, base64, urllib.request
              from opentelemetry import trace, propagate
              from opentelemetry.sdk.trace import TracerProvider
              from opentelemetry.sdk.trace.export import BatchSpanProcessor
              from opentelemetry.exporter.otlp.proto.http.trace_exporter import OTLPSpanExporter

              provider = TracerProvider()            # service.name comes from OTEL_SERVICE_NAME
              provider.add_span_processor(BatchSpanProcessor(OTLPSpanExporter(), max_queue_size=20000))
              trace.set_tracer_provider(provider)
              tracer = trace.get_tracer("loadgen")

              DEADLINE = time.time() + int(os.environ["DEMO_SECONDS"])
              LONG  = "Explain GPU observability for Kubernetes platform teams in detail. " * 40  # +384 gen < max-model-len 1024

              def fire(target, url, prompt, max_tokens, ignore_eos):
                  with tracer.start_as_current_span("chat request", kind=trace.SpanKind.CLIENT,
                                                    attributes={"llm.target": target}) as span:
                      headers = {"Content-Type": "application/json"}
                      propagate.inject(headers)              # traceparent -> vLLM continues the same trace
                      body = json.dumps({"model": "facebook/opt-125m",
                                         "prompt": f"Request {uuid.uuid4().hex}. " + prompt,
                                         "max_tokens": max_tokens, "ignore_eos": ignore_eos}).encode()
                      try:
                          urllib.request.urlopen(urllib.request.Request(url, body, headers), timeout=120).read()
                      except Exception as e:
                          span.set_status(trace.Status(trace.StatusCode.ERROR, str(e)[:200]))

              def worker(target, url, prompt, max_tokens, ignore_eos):
                  while time.time() < DEADLINE:
                      fire(target, url, prompt, max_tokens, ignore_eos)

              def annotate(text):
                  auth = base64.b64encode(os.environ["GRAFANA_AUTH"].encode()).decode()
                  req = urllib.request.Request(os.environ["GRAFANA_URL"] + "/api/annotations",
                        json.dumps({"tags": ["load"], "text": text}).encode(),
                        {"Content-Type": "application/json", "Authorization": "Basic " + auth})
                  try: urllib.request.urlopen(req, timeout=5); print("annotation:", text, flush=True)
                  except Exception as e: print("annotation failed:", e, flush=True)

              threads  = [threading.Thread(target=worker, args=("vllm-overprov", os.environ["STEADY_URL"], LONG, 384, True))
                          for _ in range(int(os.environ["STEADY_CONC"]))]
              threads += [threading.Thread(target=worker, args=("vllm-constrained", os.environ["SATURATE_URL"], LONG, 384, True))
                          for _ in range(int(os.environ["SATURATE_CONC"]))]
              annotate("load hits")
              print(f"{len(threads)} workers for {os.environ['DEMO_SECONDS']}s", flush=True)
              for t in threads: t.start()
              for t in threads: t.join()
              provider.shutdown()
              print("loadgen finished", flush=True)
              PY
