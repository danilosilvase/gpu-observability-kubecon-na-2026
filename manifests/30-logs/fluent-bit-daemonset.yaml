apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: observability
  labels: { app: fluent-bit }
spec:
  selector:
    matchLabels: { app: fluent-bit }
  template:
    metadata:
      labels: { app: fluent-bit }
    spec:
      serviceAccountName: fluent-bit
      # run on the GPU nodes where vLLM lives
      nodeSelector: { workload-type: gpu-inference }
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.1.9
          volumeMounts:
            - { name: config, mountPath: /fluent-bit/etc/ }
            - { name: varlog, mountPath: /var/log, readOnly: true }
            - { name: containers, mountPath: /var/log/containers, readOnly: true }
            - { name: pods, mountPath: /var/log/pods, readOnly: true }
      volumes:
        - name: config
          configMap: { name: fluent-bit-config }
        - name: varlog
          hostPath: { path: /var/log }
        - name: containers
          hostPath: { path: /var/log/containers }
        - name: pods
          hostPath: { path: /var/log/pods }
