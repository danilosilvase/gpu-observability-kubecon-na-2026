apiVersion: v1
kind: ServiceAccount
metadata: { name: fluent-bit, namespace: observability }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: fluent-bit }
rules: [ { apiGroups: [""], resources: ["pods","namespaces"], verbs: ["get","list","watch"] } ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: fluent-bit }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fluent-bit }
subjects: [ { kind: ServiceAccount, name: fluent-bit, namespace: observability } ]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: fluent-bit-config, namespace: observability }
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Log_Level    info
        Parsers_File parsers.conf
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/vllm-*_inference_*.log
        Parser            cri
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            On
        Labels              Off
        Annotations         Off
    [FILTER]
        Name    lua
        Match   kube.*
        script  extract_tokens.lua
        call    extract_vllm_metrics
    [FILTER]
        Name    grep
        Match   kube.*
        Regex   vllm_parsed true
    # 5) log_to_metrics: turn the parsed fields into Prometheus gauges labelled by pod_name.
    #    This is the "the log line IS the telemetry" step: no exporter needed on the server side.
    [FILTER]
        Name               log_to_metrics
        Match              kube.*
        Tag                vllm_log_metrics
        Metric_mode        gauge
        Metric_namespace   vllm
        Metric_subsystem   log
        Metric_name        kv_cache_usage_pct
        Metric_description KV cache usage (%) parsed from the vLLM stats log line
        Value_field        kv_cache_usage_pct
        Label_field        pod_name
        Label_field        namespace
        Kubernetes_mode    off
    [FILTER]
        Name               log_to_metrics
        Match              kube.*
        Tag                vllm_log_metrics
        Metric_mode        gauge
        Metric_namespace   vllm
        Metric_subsystem   log
        Metric_name        waiting_reqs
        Metric_description Requests waiting in the scheduler queue, parsed from the vLLM stats log line
        Value_field        waiting_reqs
        Label_field        pod_name
        Label_field        namespace
        Kubernetes_mode    off
    [FILTER]
        Name               log_to_metrics
        Match              kube.*
        Tag                vllm_log_metrics
        Metric_mode        gauge
        Metric_namespace   vllm
        Metric_subsystem   log
        Metric_name        running_reqs
        Metric_description Requests currently running, parsed from the vLLM stats log line
        Value_field        running_reqs
        Label_field        pod_name
        Label_field        namespace
        Kubernetes_mode    off
    [FILTER]
        Name               log_to_metrics
        Match              kube.*
        Tag                vllm_log_metrics
        Metric_mode        gauge
        Metric_namespace   vllm
        Metric_subsystem   log
        Metric_name        preemptions_total
        Metric_description Preemptions (requests evicted because KV cache was full), parsed from the vLLM stats log line
        Value_field        preemptions
        Label_field        pod_name
        Label_field        namespace
        Kubernetes_mode    off
    [FILTER]
        Name               log_to_metrics
        Match              kube.*
        Tag                vllm_log_metrics
        Metric_mode        gauge
        Metric_namespace   vllm
        Metric_subsystem   log
        Metric_name        gen_tokens_per_s
        Metric_description Generation throughput (tokens/s) parsed from the vLLM stats log line
        Value_field        gen_tokens_per_s
        Label_field        pod_name
        Label_field        namespace
        Kubernetes_mode    off
    [OUTPUT]
        Name   stdout
        Match  kube.*
        Format json_lines
    # Expose the log-derived gauges on :2021/metrics (ClusterIP only, scraped by Prometheus)
    [OUTPUT]
        Name   prometheus_exporter
        Match  vllm_log_metrics
        Host   0.0.0.0
        Port   2021
  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
  extract_tokens.lua: |
    function extract_vllm_metrics(tag, ts, record)
        local line = record["log"] or record["message"] or ""
        local gen = string.match(line, "generation throughput:%s*([%d%.]+)%s*tokens/s")
        if gen == nil then
            record["vllm_parsed"] = "false"
            return 1, ts, record
        end
        record["gen_tokens_per_s"]    = tonumber(gen)
        record["prompt_tokens_per_s"] = tonumber(string.match(line, "prompt throughput:%s*([%d%.]+)%s*tokens/s")) or 0.0
        record["running_reqs"]        = tonumber(string.match(line, "Running:%s*(%d+)%s*reqs")) or 0
        record["waiting_reqs"]        = tonumber(string.match(line, "Waiting:%s*(%d+)%s*reqs")) or 0
        record["kv_cache_usage_pct"]  = tonumber(string.match(line, "KV cache usage:%s*([%d%.]+)%%")) or 0.0
        -- only printed by vLLM once the scheduler has evicted at least one request (KV cache full)
        record["preemptions"]         = tonumber(string.match(line, "Preemptions:%s*(%d+)")) or 0
        record["vllm_parsed"]         = "true"
        local kube = record["kubernetes"] or {}
        record["pod_name"]  = kube["pod_name"]
        record["namespace"] = kube["namespace_name"]
        return 2, ts, record
    end
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: fluent-bit, namespace: observability, labels: { app: fluent-bit } }
spec:
  selector: { matchLabels: { app: fluent-bit } }
  template:
    metadata: { labels: { app: fluent-bit } }
    spec:
      serviceAccountName: fluent-bit
      nodeSelector: { workload-type: gpu-inference }
      tolerations: [ { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule } ]
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.3
          ports: [ { name: metrics, containerPort: 2021 } ]
          volumeMounts:
            - { name: config, mountPath: /fluent-bit/etc/ }
            - { name: varlog, mountPath: /var/log, readOnly: true }
            - { name: containers, mountPath: /var/log/containers, readOnly: true }
            - { name: pods, mountPath: /var/log/pods, readOnly: true }
      volumes:
        - { name: config, configMap: { name: fluent-bit-config } }
        - { name: varlog, hostPath: { path: /var/log } }
        - { name: containers, hostPath: { path: /var/log/containers } }
        - { name: pods, hostPath: { path: /var/log/pods } }
---
apiVersion: v1
kind: Service
metadata: { name: fluent-bit-metrics, namespace: observability, labels: { app: fluent-bit } }
spec:
  type: ClusterIP
  selector: { app: fluent-bit }
  ports: [ { name: metrics, port: 2021, targetPort: 2021 } ]
