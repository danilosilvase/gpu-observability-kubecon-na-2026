apiVersion: v1
kind: ServiceAccount
metadata: { name: otel-collector, namespace: observability }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: otel-collector }
rules:
  - { apiGroups: [""], resources: ["pods","namespaces","nodes"], verbs: ["get","list","watch"] }
  - { apiGroups: ["apps"], resources: ["replicasets"], verbs: ["get","list","watch"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: otel-collector }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: otel-collector }
subjects: [ { kind: ServiceAccount, name: otel-collector, namespace: observability } ]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector-config, namespace: observability }
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      batch: {}
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.node.name, k8s.deployment.name]
        pod_association:
          - sources: [ { from: connection } ]
    exporters:
      otlp/jaeger:
        endpoint: jaeger-collector.observability:4317
        tls: { insecure: true }
      debug: { verbosity: normal }
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [otlp/jaeger, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector, namespace: observability, labels: { app: otel-collector } }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/etc/otel/collector.yaml"]
          ports: [ { containerPort: 4317 }, { containerPort: 4318 } ]
          volumeMounts: [ { name: config, mountPath: /etc/otel } ]
      volumes: [ { name: config, configMap: { name: otel-collector-config } } ]
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector, namespace: observability, labels: { app: otel-collector } }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
