# Assumes kube-prometheus-stack (Prometheus Operator) is installed.
# ServiceMonitor CRDs wire dcgm-exporter + vLLM into Prometheus declaratively.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dcgm-exporter
  namespace: observability
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchLabels: { app: dcgm-exporter }
  namespaceSelector:
    matchNames: ["observability"]
  endpoints:
    - port: metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm
  namespace: inference
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchLabels: { app: vllm }
  namespaceSelector:
    matchNames: ["inference"]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
