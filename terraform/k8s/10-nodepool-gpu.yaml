apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels: { workload-type: gpu-inference }
    spec:
      nodeClassRef: { group: eks.amazonaws.com, kind: NodeClass, name: default }
      requirements:
        - { key: eks.amazonaws.com/instance-family, operator: In, values: ["g5","g6"] }
        - { key: eks.amazonaws.com/instance-size,   operator: In, values: ["xlarge","2xlarge"] }
        - { key: kubernetes.io/arch,                operator: In, values: ["amd64"] }
        - { key: karpenter.sh/capacity-type,        operator: In, values: ["on-demand"] }
      taints:
        - { key: nvidia.com/gpu, effect: NoSchedule }
      expireAfter: 24h
  limits: { cpu: "32", "nvidia.com/gpu": "2" }
  disruption: { consolidationPolicy: WhenEmpty, consolidateAfter: 5m }
