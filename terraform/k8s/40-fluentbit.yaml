apiVersion: v1
kind: ServiceAccount
metadata: { name: fluent-bit, namespace: observability }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: fluent-bit }
rules: [ { apiGroups: [""], resources: ["pods","namespaces"], verbs: ["get","list","watch"] } ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: fluent-bit }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fluent-bit }
subjects: [ { kind: ServiceAccount, name: fluent-bit, namespace: observability } ]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: fluent-bit-config, namespace: observability }
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Log_Level    info
        Parsers_File parsers.conf
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/vllm-*_inference_*.log
        Parser            cri
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            On
        Labels              Off
        Annotations         Off
    [FILTER]
        Name    lua
        Match   kube.*
        script  extract_tokens.lua
        call    extract_vllm_metrics
    [FILTER]
        Name    grep
        Match   kube.*
        Regex   vllm_parsed true
    [OUTPUT]
        Name   stdout
        Match  kube.*
        Format json_lines
  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
  extract_tokens.lua: |
    function extract_vllm_metrics(tag, ts, record)
        local line = record["log"] or record["message"] or ""
        local gen = string.match(line, "generation throughput:%s*([%d%.]+)%s*tokens/s")
        if gen == nil then
            record["vllm_parsed"] = "false"
            return 1, ts, record
        end
        record["gen_tokens_per_s"]    = tonumber(gen)
        record["prompt_tokens_per_s"] = tonumber(string.match(line, "prompt throughput:%s*([%d%.]+)%s*tokens/s")) or 0.0
        record["running_reqs"]        = tonumber(string.match(line, "Running:%s*(%d+)%s*reqs")) or 0
        record["waiting_reqs"]        = tonumber(string.match(line, "Waiting:%s*(%d+)%s*reqs")) or 0
        record["kv_cache_usage_pct"]  = tonumber(string.match(line, "KV cache usage:%s*([%d%.]+)%%")) or 0.0
        record["vllm_parsed"]         = "true"
        local kube = record["kubernetes"] or {}
        record["pod_name"]  = kube["pod_name"]
        record["namespace"] = kube["namespace_name"]
        return 2, ts, record
    end
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: fluent-bit, namespace: observability, labels: { app: fluent-bit } }
spec:
  selector: { matchLabels: { app: fluent-bit } }
  template:
    metadata: { labels: { app: fluent-bit } }
    spec:
      serviceAccountName: fluent-bit
      nodeSelector: { workload-type: gpu-inference }
      tolerations: [ { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule } ]
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.1.9
          volumeMounts:
            - { name: config, mountPath: /fluent-bit/etc/ }
            - { name: varlog, mountPath: /var/log, readOnly: true }
            - { name: containers, mountPath: /var/log/containers, readOnly: true }
            - { name: pods, mountPath: /var/log/pods, readOnly: true }
      volumes:
        - { name: config, configMap: { name: fluent-bit-config } }
        - { name: varlog, hostPath: { path: /var/log } }
        - { name: containers, hostPath: { path: /var/log/containers } }
        - { name: pods, hostPath: { path: /var/log/pods } }
