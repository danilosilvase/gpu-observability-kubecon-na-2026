apiVersion: apps/v1
kind: Deployment
metadata: { name: jaeger, namespace: observability, labels: { app: jaeger } }
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata: { labels: { app: jaeger } }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60
          env: [ { name: COLLECTOR_OTLP_ENABLED, value: "true" } ]
          ports: [ { containerPort: 4317 }, { containerPort: 16686 } ]
---
apiVersion: v1
kind: Service
metadata: { name: jaeger-collector, namespace: observability }
spec:
  selector: { app: jaeger }
  ports: [ { name: otlp-grpc, port: 4317, targetPort: 4317 } ]
---
apiVersion: v1
kind: Service
metadata: { name: jaeger-ui, namespace: observability }
spec:
  selector: { app: jaeger }
  ports: [ { name: ui, port: 16686, targetPort: 16686 } ]
